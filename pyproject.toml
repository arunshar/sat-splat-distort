[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sat_splat"
version = "0.1.0"
description = "Distortion-aware 3D Gaussian Splatting for RPC, pushbroom, fisheye, and 360 cameras."
authors = [{name = "Arun Sharma", email = "arun08sharma@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.12",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "wandb>=0.16",
  "huggingface_hub>=0.24",
  "imageio>=2.34",
  "trimesh>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]
space = ["gradio>=4.40", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
